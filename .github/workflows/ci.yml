name: Physics Verification & Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Mathematical Solver Tests & Bundle Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run physics & acoustics unit tests
        run: npm test

      - name: Verify single-file standalone bundle compilation
        run: npm run build
